# DivCDR Configuration for TenRec_QB Dataset (Video -> Article)
# Best hyperparameters tuned on this dataset

# Base CMF parameters
embedding_size: 64
alpha: 0.1
lambda: 0.1
gamma: 0.1
learning_rate: 0.0005
train_epochs: ["BOTH:300"]

# Diversity mechanism switches
enable_pull: True
enable_push: True

# ============================================
# Best Hyperparameters for TenRec_QB Dataset
# ============================================
aug_strength: 0.1
candidate_pool_size: 2
pull_weight: 0.01

# Fixed hyperparameters
info_loss_eta: 0.01
entropy_weight: 1.0
div_weight: 1.0
hardness_weight: 1.0

# DiverseSampler settings
use_diverse_sampler: True
diverse_hardness_weight: 1.0
diverse_candidate_pool_size: 2
